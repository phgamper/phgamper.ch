<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="robots" content="NOINDEX,NOFOLLOW">
    <meta name="author" content="Philipp Gamper">
    <title>Foos – phgamper.ch</title>

    <link href="../css/bootstrap.min.css" rel="stylesheet" type="text/css">
    <link href="../css/phgamper.css" rel="stylesheet" type="text/css">
    <link href="../css/darkmode.css" rel="stylesheet" type="text/css">
    <link href="../css/footer.css" rel="stylesheet" type="text/css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script src="../js/darkmode.js"></script>
    <script src="../js/jquery.min.js"></script>
    <script src="../js/bootstrap.min.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Varela+Round:100,300,400,600,700,100italic,300italic,400italic,600italic,700italic" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Ubuntu:100,300,400,600,700,100italic,300italic,400italic,600italic,700italic" rel="stylesheet" type="text/css">

    <link href="foos.css" rel="stylesheet" type="text/css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-custom fixed-top navbar-expand-md top-nav-collapse">
        <button id="darkmode-toggle" aria-label="Toggle dark mode"><span class="fa-stack"><i class="fa-solid fa-circle fa-stack-2x"></i><i class="fa-solid fa-moon fa-stack-1x fa-inverse" id="darkmode-icon"></i></span></button>
        <a class="nav-link navbar-brand ms-auto" href="/" aria-label="Home"><i class="fa-solid fa-house"></i></a>
    </nav>

    <!-- Main content -->
    <main class="foos-content">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <!-- Bo5 Scoreboard
                         Layout (8 columns × 3 rows):
                           [blank] | Team  |  S  |  P  |  P  |  P  |  P  |  P
                           W       | TeamA | [ ] | [ ] | [ ] | [ ] | [ ] | [ ]
                           B       | TeamB | [ ] | [ ] | [ ] | [ ] | [ ] | [ ]
                    -->
                    <div class="foos-scoreboard mb-4">

                        <!-- Team A row (white) -->
                        <div class="foos-sb-cell foos-cell-white"></div>
                        <div class="foos-sb-cell foos-sb-name">Team A</div>
                        <div class="foos-sb-cell foos-sb-sets"></div>
                        <div class="foos-sb-cell foos-sb-score"></div>
                        <div class="foos-sb-cell foos-sb-score"></div>
                        <div class="foos-sb-cell foos-sb-score"></div>
                        <div class="foos-sb-cell foos-sb-score"></div>
                        <div class="foos-sb-cell foos-sb-score"></div>

                        <!-- Team B row (black) -->
                        <div class="foos-sb-cell foos-cell-black"></div>
                        <div class="foos-sb-cell foos-sb-name">Team B</div>
                        <div class="foos-sb-cell foos-sb-sets"></div>
                        <div class="foos-sb-cell foos-sb-score"></div>
                        <div class="foos-sb-cell foos-sb-score"></div>
                        <div class="foos-sb-cell foos-sb-score"></div>
                        <div class="foos-sb-cell foos-sb-score"></div>
                        <div class="foos-sb-cell foos-sb-score"></div>

                    </div><!-- /.foos-scoreboard -->

                    <!-- Colored grid
                         Layout (5 columns × 8 rows):
                           T  T  W  T  T
                           B  G  G  G  T
                           T  G  G  G  W
                           B  G  G  G  T
                           T  G  G  G  W
                           B  G  G  G  T
                           T  G  G  G  W
                           T  T  B  T  T
                         Horizontally adjacent same-colour cells are merged.
                    -->
                    <div class="foos-grid">

                        <!-- Row 1: (T T) W (T T) -->
                        <div class="foos-cell foos-cell-transparent foos-span-2"></div>
                        <div class="foos-cell foos-cell-white"></div>
                        <div class="foos-cell foos-cell-transparent foos-span-2"></div>

                        <!-- Row 2: B (G G G) T -->
                        <div class="foos-cell foos-cell-black"></div>
                        <div class="foos-cell foos-cell-grey foos-span-3"></div>
                        <div class="foos-cell foos-cell-transparent"></div>

                        <!-- Row 3: T (G G G) W -->
                        <div class="foos-cell foos-cell-transparent"></div>
                        <div class="foos-cell foos-cell-grey foos-span-3"></div>
                        <div class="foos-cell foos-cell-white"></div>

                        <!-- Row 4: B (G G G) T -->
                        <div class="foos-cell foos-cell-black"></div>
                        <div class="foos-cell foos-cell-grey foos-span-3"></div>
                        <div class="foos-cell foos-cell-transparent"></div>

                        <!-- Row 5: T (G G G) W -->
                        <div class="foos-cell foos-cell-transparent"></div>
                        <div class="foos-cell foos-cell-grey foos-span-3"></div>
                        <div class="foos-cell foos-cell-white"></div>

                        <!-- Row 6: B (G G G) T -->
                        <div class="foos-cell foos-cell-black"></div>
                        <div class="foos-cell foos-cell-grey foos-span-3"></div>
                        <div class="foos-cell foos-cell-transparent"></div>

                        <!-- Row 7: T (G G G) W -->
                        <div class="foos-cell foos-cell-transparent"></div>
                        <div class="foos-cell foos-cell-grey foos-span-3"></div>
                        <div class="foos-cell foos-cell-white"></div>

                        <!-- Row 8: (T T) B (T T) -->
                        <div class="foos-cell foos-cell-transparent foos-span-2"></div>
                        <div class="foos-cell foos-cell-black"></div>
                        <div class="foos-cell foos-cell-transparent foos-span-2"></div>

                    </div><!-- /.foos-grid -->

                    <!-- Toolbar
                         Layout (12 columns): T | E | E | E | U | S | E | R | E | E | E | T
                         T = Timeout, U = Undo, S = Switch side, R = Reset, E = empty
                    -->
                    <div class="foos-toolbar">
                        <button class="foos-tb-btn" type="button" aria-label="Timeout (Team A)"><i class="fa-solid fa-stopwatch"></i></button>
                        <div class="foos-tb-empty"></div>
                        <div class="foos-tb-empty"></div>
                        <div class="foos-tb-empty"></div>
                        <button class="foos-tb-btn" type="button" aria-label="Undo"><i class="fa-solid fa-rotate-left"></i></button>
                        <button class="foos-tb-btn" type="button" aria-label="Switch side"><i class="fa-solid fa-shuffle"></i></button>
                        <div class="foos-tb-empty"></div>
                        <button class="foos-tb-btn" type="button" aria-label="Reset"><i class="fa-solid fa-trash"></i></button>
                        <div class="foos-tb-empty"></div>
                        <div class="foos-tb-empty"></div>
                        <div class="foos-tb-empty"></div>
                        <button class="foos-tb-btn" type="button" aria-label="Timeout (Team B)"><i class="fa-solid fa-stopwatch"></i></button>
                    </div><!-- /.foos-toolbar -->

                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-inner row">
                <div class="col-6">
                    <p>maintained by <a href="/">phgamper</a></p>
                </div>
                <div class="col-6">
                    <p class="float-end"><a href="#">Back to top</a></p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Collapse navbar on scroll (same pattern as main page)
        function collapseNavbar() {
            document.querySelector('.navbar.fixed-top').classList.toggle('top-nav-collapse', window.scrollY > 50);
        }
        collapseNavbar();
        window.addEventListener('scroll', collapseNavbar);
    </script>

</body>

</html>
